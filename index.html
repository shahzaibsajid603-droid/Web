<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com; connect-src 'self' https://xqcrkklhhwsuhnqphtxg.supabase.co https://api.cloudinary.com; img-src 'self' data: blob: https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; base-uri 'self'; form-action 'self';">
  <title>Aroosh Online Tutors - Expert Tutoring Platform</title>
  <meta name="description" content="Connect with expert tutors online. Flexible scheduling, personalized learning, and real results.">
  <meta name="theme-color" content="#A79277">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <script>
    // Guaranteed loading screen failsafe - always hides within 2s no matter what
    setTimeout(function() {
      var ls = document.getElementById('loading-screen');
      if (ls) {
        ls.classList.add('fade-out');
        setTimeout(function() { if (ls.parentNode) ls.remove(); }, 600);
      }
    }, 4000);
  </script>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-logo-wrapper">
        <div class="loading-logo-glow"></div>
        <img src="aroosh-logo-light.png" alt="Aroosh Online Tutors" class="loading-logo">
      </div>
      <div class="loading-text">
        <span class="loading-title">Aroosh Online Tutors</span>
        <span class="loading-subtitle">Expert Tutoring for Every Subject</span>
      </div>
      <div class="loading-bar-track">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Sidebar Container -->
  <aside id="sidebar" class="sidebar">
    <!-- Sidebar will be injected here -->
  </aside>

  <!-- Main layout wrapper -->
  <div class="main-wrapper">
    <!-- Mobile top bar -->
    <header class="mobile-header">
      <button id="mobile-hamburger" class="mobile-hamburger-btn" aria-label="Open Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="mobile-logo">
        <img src="aroosh-logo-light.png" alt="Aroosh Online Tutors" class="logo-img logo-light">
        <img src="aroosh-logo-dark.png" alt="Aroosh Online Tutors" class="logo-img logo-dark">
      </div>
    </header>

    <main id="app" class="container"></main>
  </div>

  <!-- Sidebar Overlay Backdrop for mobile -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- WhatsApp Floating Button Component -->
  <div id="whatsapp-component">
    <!-- Floating Button -->
    <button id="whatsapp-button" class="whatsapp-floating-btn" aria-label="Open WhatsApp">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.004c-1.025 0-2.02-.315-2.884-.9l-.207-.124-2.144.561.569-2.08-.134-.213c-.614-.883-.941-1.9-.941-2.967 0-3.392 2.759-6.15 6.15-6.15 1.643 0 3.185.639 4.349 1.797 1.164 1.158 1.803 2.701 1.803 4.345 0 3.396-2.759 6.153-6.15 6.153m8.872-12.168C19.313 1.843 15.97 0 12.109 0 5.926 0 .75 5.175.75 11.358c0 2.059.533 4.068 1.541 5.825L.92 23.93l6.935-1.82c1.696.922 3.599 1.413 5.539 1.413 6.187 0 11.358-5.171 11.358-11.358 0-3.042-1.18-5.897-3.326-8.042"/>
      </svg>
    </button>

    <!-- Modal Overlay -->
    <div id="whatsapp-modal-overlay" class="whatsapp-modal-overlay"></div>

    <!-- Modal -->
    <div id="whatsapp-modal" class="whatsapp-modal">
      <!-- Modal Header -->
      <div class="whatsapp-modal-header">
        <h2 class="whatsapp-modal-title">WhatsApp</h2>
        <button id="whatsapp-close-btn" class="whatsapp-close-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="whatsapp-modal-body">
        <form id="whatsapp-form" class="whatsapp-form">
          <!-- Name Field -->
          <div class="whatsapp-form-group">
            <label for="whatsapp-name" class="whatsapp-form-label">Name <span class="whatsapp-required">*</span></label>
            <input 
              type="text" 
              id="whatsapp-name" 
              class="whatsapp-form-input" 
              placeholder="Your name" 
              required
              aria-label="Your name"
            />
          </div>

          <!-- Email Field -->
          <div class="whatsapp-form-group">
            <label for="whatsapp-email" class="whatsapp-form-label">Email <span class="whatsapp-optional">(optional)</span></label>
            <input 
              type="email" 
              id="whatsapp-email" 
              class="whatsapp-form-input" 
              placeholder="your@email.com"
              aria-label="Your email"
            />
          </div>

          <!-- Message Field -->
          <div class="whatsapp-form-group">
            <label for="whatsapp-message" class="whatsapp-form-label">Message <span class="whatsapp-required">*</span></label>
            <textarea 
              id="whatsapp-message" 
              class="whatsapp-form-textarea" 
              placeholder="Type your message here..." 
              rows="4"
              required
              aria-label="Your message"
            ></textarea>
            <div class="whatsapp-char-count">
              <span id="whatsapp-char-counter">0</span>/1000
            </div>
          </div>
        </form>
      </div>

      <!-- Modal Footer -->
      <div class="whatsapp-modal-footer">
        <button id="whatsapp-send-btn" class="whatsapp-send-btn" aria-label="Send via WhatsApp">
          Send via WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- AI Assistant Floating Chatbot -->

  <script src="app.js"></script>
</body>
</html>
