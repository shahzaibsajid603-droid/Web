<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://xqcrkklhhwsuhnqphtxg.supabase.co; img-src 'self' data: blob:; base-uri 'self'; form-action 'self';"/>
<title>Complete Your Profile – Aroosh Online Tutors</title>

<style>
@font-face{font-family:"Quffer";src:url("fonts/Quffer.woff2") format("woff2"),url("fonts/Quffer.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-primary:#8a307f;--color-secondary:#79a7d3;--color-accent:#6883bc;
  --color-background:#faf9fc;--color-surface:#ffffff;--color-muted:#e8e5f0;
  --color-text-primary:#2d1b3d;--color-text-secondary:#6b5b7f;
  --color-success:#10b981;--color-error:#ef4444;
  --radius-md:8px;--radius-lg:12px;--radius-xl:16px;
  --font:'Quffer',serif;
}
body{
  font-family:var(--font);
  background: linear-gradient(145deg,#2d1b3d 0%,#4a3a5c 45%,#3a2456 70%,#2d1b3d 100%);
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:40px 24px;position:relative;overflow-x:hidden;overflow-y:auto;background-attachment:fixed;
}
body::before{content:'';position:absolute;width:400px;height:400px;
  background:radial-gradient(circle,rgba(138,48,127,.35) 0%,transparent 70%);
  top:-80px;left:-80px;border-radius:50%;
}
body::after{content:'';position:absolute;width:350px;height:350px;
  background:radial-gradient(circle,rgba(121,167,211,.25) 0%,transparent 70%);
  bottom:-60px;right:-60px;border-radius:50%;
}
.container{position:relative;z-index:2;width:100%;max-width:580px}
.card{
  background:var(--color-surface);border-radius:var(--radius-xl);
  padding:40px 36px 36px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:fadeUp .5s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.brand{display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.brand-logo{height:64px;width:auto;max-width:100%;object-fit:contain;border-radius:var(--radius-md)}
h1{font-size:22px;font-weight:800;color:var(--color-text-primary);margin-bottom:6px}
.subtitle{font-size:13px;color:var(--color-text-secondary);margin-bottom:28px}
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:6px}
label .optional{font-weight:400;color:#b0a8c0}
.form-input,.form-select,.form-textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--color-muted);border-radius:var(--radius-md);
  font-size:14px;font-family:var(--font);background:var(--color-background);color:var(--color-text-primary);
  transition:all .2s;outline:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:var(--color-primary);background:var(--color-surface);box-shadow:0 0 0 3px rgba(138,48,127,.1);
}
.form-input::placeholder,.form-textarea::placeholder{color:#b0a8c0}
.form-textarea{resize:vertical;min-height:80px}
input[type="file"].form-input{padding:8px 12px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.checkbox-item{display:flex;align-items:center;gap:6px;background:var(--color-background);padding:6px 12px;
  border-radius:var(--radius-md);border:1.5px solid var(--color-muted);cursor:pointer;transition:all .2s;font-size:13px}
.checkbox-item:hover{border-color:var(--color-primary)}
.checkbox-item input{cursor:pointer;accent-color:var(--color-primary)}
.preview-img{width:72px;height:72px;object-fit:cover;border-radius:50%;border:2px solid var(--color-muted);margin-top:8px;display:none}
.btn-primary{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));
  color:#fff;border:none;border-radius:var(--radius-lg);font-size:15px;font-weight:700;
  font-family:var(--font);cursor:pointer;box-shadow:0 4px 14px rgba(138,48,127,.4);
  transition:all .2s;position:relative;
}
.btn-primary:hover:not(:disabled){transform:translateY(-1px)}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-primary .loader{
  display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .8s linear infinite;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
}
.btn-primary.loading{color:transparent}
.btn-primary.loading .loader{display:block}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.error-message{font-size:12px;color:var(--color-error);margin-top:4px;display:none}
.error-message.show{display:block}
.success-message{
  background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.05));
  border:1px solid rgba(16,185,129,.3);color:var(--color-success);
  padding:12px 14px;border-radius:var(--radius-md);font-size:13px;margin-bottom:16px;display:none;
}
.success-message.show{display:block}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="brand">
      <img src="aroosh-logo-light.jpg.jpeg" alt="Aroosh Online Tutors" class="brand-logo"/>
    </div>

    <h1>Complete Your Profile</h1>
    <p class="subtitle">Student — Step 2 of 2</p>

    <div class="success-message" id="success-msg"></div>

    <form id="setupForm">
      <div class="form-group">
        <label for="photo">Profile Photo <span class="optional">(optional)</span></label>
        <input class="form-input" type="file" id="photo" accept="image/*"/>
        <img class="preview-img" id="photo-preview" alt="Preview"/>
      </div>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input class="form-input" type="text" id="fullName" placeholder="Your full name" required/>
        <div class="error-message" id="name-error"></div>
      </div>

      <div class="form-group">
        <label for="grade">Grade / Education Level</label>
        <select class="form-select" id="grade" required>
          <option value="">Select your grade</option>
          <option value="Elementary">Elementary School</option>
          <option value="Middle School">Middle School</option>
          <option value="High School">High School</option>
          <option value="College">College</option>
          <option value="Adult">Adult Learner</option>
          <option value="IB MYP">IB Middle Years Programme (MYP)</option>
          <option value="IB DP">IB Diploma Programme (DP)</option>
          <option value="IGCSE">IGCSE</option>
          <option value="A-Levels">A-Levels / AS-Levels</option>
          <option value="AP">AP (Advanced Placement)</option>
        </select>
        <div class="error-message" id="grade-error"></div>
      </div>

      <div class="form-group">
        <label>Subjects You Need Help With</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" value="Math" name="subjects"> Math</label>
          <label class="checkbox-item"><input type="checkbox" value="English" name="subjects"> English</label>
          <label class="checkbox-item"><input type="checkbox" value="Science" name="subjects"> Science</label>
          <label class="checkbox-item"><input type="checkbox" value="History" name="subjects"> History</label>
          <label class="checkbox-item"><input type="checkbox" value="Languages" name="subjects"> Languages</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts" name="subjects"> Arts</label>
          <label class="checkbox-item"><input type="checkbox" value="Technology" name="subjects"> Technology</label>
          <label class="checkbox-item"><input type="checkbox" value="Physics" name="subjects"> Physics</label>
          <label class="checkbox-item"><input type="checkbox" value="Chemistry" name="subjects"> Chemistry</label>
          <label class="checkbox-item"><input type="checkbox" value="Biology" name="subjects"> Biology</label>
        </div>
        <div class="error-message" id="subjects-error"></div>
      </div>

      <div class="form-group">
        <label for="goals">Learning Goals</label>
        <textarea class="form-textarea" id="goals" rows="3" placeholder="What do you want to achieve? e.g., Prepare for SAT Math, improve essay writing..." required></textarea>
        <div class="error-message" id="goals-error"></div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">
        Save Profile & Continue
        <div class="loader"></div>
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://xqcrkklhhwsuhnqphtxg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_h_xLHP7xPecIqhASfg26-Q_lDPFfvKy';
  let client = null;
  let userId = null;
  let userEmail = null;

  function initSupabase() {
    const sdk = window.supabase;
    if (sdk && sdk.createClient) {
      try { client = sdk.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error(e); }
    } else {
      window.addEventListener('load', function () {
        const sdk2 = window.supabase;
        if (sdk2 && sdk2.createClient) {
          try { client = sdk2.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error(e); }
        }
        requireAuth();
      });
    }
  }

  // Must be authenticated
  async function requireAuth() {
    if (!client) return;
    try {
      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        window.location.href = 'signup-student.html';
        return;
      }
      userId = session.user.id;
      userEmail = session.user.email;
    } catch (e) {
      window.location.href = 'signup-student.html';
    }
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.classList.add('show'); }
  }
  function clearErrors() {
    document.querySelectorAll('.error-message').forEach(function (el) {
      el.classList.remove('show'); el.textContent = '';
    });
  }

  document.getElementById('photo')?.addEventListener('change', function (e) {
    const file = e.target.files[0];
    const preview = document.getElementById('photo-preview');
    if (file && preview) {
      const reader = new FileReader();
      reader.onload = function (ev) { preview.src = ev.target.result; preview.style.display = 'block'; };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('setupForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearErrors();
    if (!client) { showError('goals-error', 'Client not ready. Please refresh.'); return; }

    // Always fetch fresh auth state
    let currentUserId = userId;
    let currentEmail = userEmail;
    if (!currentUserId || !currentEmail) {
      try {
        const { data: { session } } = await client.auth.getSession();
        if (!session) { window.location.href = 'signup-student.html'; return; }
        currentUserId = session.user.id;
        currentEmail = session.user.email;
      } catch (e) {
        showError('goals-error', 'Auth error. Please refresh and try again.');
        return;
      }
    }
    if (!currentEmail) { showError('goals-error', 'Unable to get your email. Please refresh.'); return; }

    const grade = document.getElementById('grade').value;
    const goals = document.getElementById('goals').value.trim();
    const subjects = Array.from(document.querySelectorAll('input[name="subjects"]:checked')).map(cb => cb.value);
    const photoInput = document.getElementById('photo');

    const fullName = document.getElementById('fullName').value.trim();

    let hasError = false;
    if (!fullName) { showError('name-error', 'Enter your full name'); hasError = true; }
    if (!grade) { showError('grade-error', 'Select your grade level'); hasError = true; }
    if (subjects.length === 0) { showError('subjects-error', 'Select at least one subject'); hasError = true; }
    if (!goals) { showError('goals-error', 'Enter your learning goals'); hasError = true; }
    if (hasError) return;

    const btn = document.getElementById('submit-btn');
    btn.classList.add('loading'); btn.disabled = true;

    let avatar = null;
    if (photoInput.files && photoInput.files[0]) {
      avatar = await new Promise(function (resolve) {
        const reader = new FileReader();
        reader.onload = function (ev) { resolve(ev.target.result); };
        reader.readAsDataURL(photoInput.files[0]);
      });
    }

    try {
      const updates = {
        id: currentUserId,
        email: currentEmail,
        name: fullName,
        subjects,
        experience_level: grade,
        bio: goals,
        is_available: true,
        role: 'student'
      };
      if (avatar) updates.avatar = avatar;

      console.log('[Profile Setup] Saving profile for user:', currentUserId, updates);
      const { error, data } = await client.from('profiles').upsert(updates, { onConflict: 'id' });
      if (error) {
        console.error('[Profile Setup] Supabase error code:', error.code, 'details:', error.details, 'hint:', error.hint, 'message:', error.message);
        showError('goals-error', 'Failed to save profile: ' + (error.message || 'Unknown error'));
        btn.classList.remove('loading'); btn.disabled = false;
        return;
      }
      console.log('[Profile Setup] Success:', data);

      const el = document.getElementById('success-msg');
      el.textContent = 'Profile saved! Redirecting to dashboard...';
      el.classList.add('show');
      setTimeout(function () { window.location.href = 'index.html#/student-dashboard'; }, 1200);
    } catch (err) {
      console.error('[Profile Setup] Exception:', err);
      showError('goals-error', 'An error occurred: ' + err.message);
      btn.classList.remove('loading'); btn.disabled = false;
    }
  });

  initSupabase();
  requireAuth();
})();
</script>
</body>
</html>
